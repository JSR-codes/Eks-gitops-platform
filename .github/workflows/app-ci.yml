name: app-ci

# test -> build & scan -> push to ECR -> bump tag in Git -> Argo CD deploys
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: demo-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      # Empty until you add the secret; AWS steps are skipped until then
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: demo-app:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Note when AWS is not configured yet
        if: github.event_name != 'pull_request' && env.AWS_ROLE_ARN == ''
        run: echo "::notice::AWS_ROLE_ARN secret not set. Image built and scanned; push and deploy skipped."

      - name: Scan image (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-app:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name != 'pull_request' && env.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: github.event_name != 'pull_request' && env.AWS_ROLE_ARN != ''
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag "demo-app:${TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  deploy:
    # GitOps: CI never touches the cluster. It commits the new tag and
    # Argo CD pulls the change.
    needs: build
    if: needs.build.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Bump image tag in dev values
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
          REPO: ${{ steps.ecr.outputs.registry }}/demo-app
        run: |
          yq -i ".image.tag = strenv(TAG) | .image.repository = strenv(REPO)" charts/demo-app/values-dev.yaml
          git diff --stat

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/demo-app/values-dev.yaml
          git commit -m "deploy: demo-app ${TAG}" || { echo "No change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done

      - name: Summary
        run: |
          {
            echo "### Deployed demo-app \`${{ needs.build.outputs.image_tag }}\`"
            echo "Argo CD will sync within ~60s. Commit time: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
