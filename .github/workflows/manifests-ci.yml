name: manifests-ci

# Catches broken Helm templates and invalid Kubernetes YAML before
# Argo CD ever sees them.
on:
  pull_request:
    paths:
      - "charts/**"
      - "gitops/**"
      - ".github/workflows/manifests-ci.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "gitops/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.6.7"
      K8S_VERSION: "1.31.0"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: YAML lint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yaml gitops charts/demo-app/values*.yaml .github

      - name: Helm lint
        run: |
          helm lint charts/demo-app -f charts/demo-app/values.yaml -f charts/demo-app/values-dev.yaml --strict
          helm lint gitops/bootstrap --strict

      - name: Render and validate
        run: |
          mkdir -p rendered
          helm template demo-app charts/demo-app -f charts/demo-app/values.yaml -f charts/demo-app/values-dev.yaml > rendered/demo-app.yaml
          helm template root gitops/bootstrap > rendered/root.yaml
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version "${K8S_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ gitops/apps/ gitops/monitoring/
